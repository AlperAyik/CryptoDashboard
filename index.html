<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>cyrptodashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css"/>
    <link rel="icon" type="image/x-icon" href="/public/Images/coinFavicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Sekuya&display=swap"
          rel="stylesheet">
    <!--  font-family: "Sekuya", system-ui;
      font-style: normal;-->
</head>

<body class="bg-[#0A0E1A]">
<!--Title-->
<section id="title" class="p-10">
    <div class="flex justify-center">
        <h1 style="font-family: 'Sekuya';" class="text-white  text-4xl">Cyrptodashboard</h1>
    </div>
    <div class="flex justify-end -m-10 mr-8">
        <button id="notificationsBTn" class="fixed"><img src="/Images/notification.png"
                                                         class="bg-white shadow-blue-500 h-10 w-10 rounded-4xl" alt="">
        </button>
        <p class="rounded-[50%] h-5 w-5 bg-red-500 -ml-4 mb-7 text-white fixed"><span
                class="flex justify-center mb-5">1</span></p>
        <div class="notBar mt-11 fixed">
            <p class="h-2 w-2 bg-white -mb-6 -ml-8 border-[0, 3px, 0, 3px] border-black inline-1 p-3 rotate-45"></p>
            <div id="notBarText" class="bg-white w-25 absolute -ml-17 mt-2 rounded-md">
                <p class="pText"></p>
            </div>
        </div>
    </div>


</section>
<!--  Navbar-->
<section id="navbar" class='navbar'>
    <div class="h-fit">
        <ul class="p-5 text-gray-200 font-medium">
            <li class="flex items-center justify-center border border-gray-300 bg-white rounded-4xl p-5 mb-5 hover:bg-gray-500 duration-500 border-gray-500">
                <img src="/Images/Home.png" alt="" class="w-10 h-10">
            </li>
            <li class="flex items-center justify-center border border-gray-300 bg-white rounded-4xl p-5 mb-5 hover:bg-gray-500 duration-500 border-gray-500">
                <img src="/Images/Contact.png" alt="" class="w-10 h-10">
            </li>
            <li class="flex items-center justify-center border border-gray-300 bg-white rounded-4xl p-5 mb-5 hover:bg-gray-500 duration-500 border-gray-500">
                <img src="/Images/profile.png" alt="" class="w-10 h-10">
            </li>
        </ul>
    </div>
    <div class="flex justify-center">
        <button id="closeNav" class="bg-white p-2 mb-5 rounded-md"><img src="/Images/close.png" alt="" class="h-5 w-5">
        </button>
    </div>
</section>
<!-- Open navbar-->
<div class="absolute bg-[#111827] w-fit border border-[#1F2937] rounded-tr-xl rounded-br-xl mt-26">
    <button class="btnOpen fixed "><img src="/Images/Open.png" alt="" class="h-10 w-10"></button>
</div>

<div>

</div>
<!-- API -->
<section id="trending" class="flex mt-16.5  justify-center items-center gap-5">
    <div class="grid grid-cols-3 gap-5">
        <div>
            <h1 class="text-gray-200 text-sm font-medium mb-2" style="font-family: 'Sekuya'; font-size: small;">🔥 Trending Coins</h1>
            <div id="trending_coins"
                 class="grid grid-cols-1 mt-4 bg-[#111827]  border border-[#1F2937] p-6 rounded-xl h-100 w-130">
            </div>
        </div>
        <div>
            <h1 class="text-gray-200 text-sm font-medium mb-2" style="font-family: 'Sekuya'; font-size: small;">🔥 Trending NFTs:</h1>
            <div id="trending_nft"
                 class="grid grid-cols-1 mt-5 bg-[#111827] border border-[#1F2937] p-6 rounded-xl mb-2 h-100 w-130 shadow-red-900">
            </div>
        </div>
        <div>
            <h1 class="text-gray-200 text-sm font-medium mb-2" style="font-family: 'Sekuya'; font-size: small;">🔥 Trending Other:</h1>
            <div id="trending_other"
                 class="grid grid-cols-1 mt-5 bg-[#111827] border border-[#1F2937] p-6 rounded-xl mb-2 h-100 w-130 shadow-red-900">
            </div>
        </div>
    </div>
</section>

<div class="flex justify-center items-center gap-5 mt-10">
    <div class="bg-[#111827] w-fit p-10 rounded-xl">
        <div class=" rounded-4xl text-white">
            <h1 class="text-white" style="font-family: 'Sekuya';">Total market cap: <span class="circular_bar"
                                                                                          title="total market cap"><span
                    id="totalMarketCap" style="font-family: 'Sekuya'; font-size: medium">2T</span></span></h1>
        </div>
    </div>
    <div class="bg-[#111827] w-fit p-10 rounded-xl">
        <div class=" rounded-4xl text-white">
            <h1 class="text-white" style="font-family: 'Sekuya'; font-size: medium">Total Active Crypto currencies : <span class="circular_bar"
                                                                                                  title="total market cap"><span
                    id="totalCryptoCurrencies" style="font-family: 'Sekuya'; font-size: medium">2T</span></span></h1>
        </div>
    </div>
    <div class="bg-[#111827] w-fit p-10 rounded-xl">
        <div class=" rounded-4xl text-white">
            <h1 class="text-white" style="font-family: 'Sekuya';">Total market volume: <span class="circular_bar" title="total market cap"><span
                    id="totalVolume" style="font-family: 'Sekuya'; font-size: medium">2T</span></span></h1>
        </div>
    </div>
</div>

<div class="flex justify-center mt-10">
    <div class="bg-[#111827] w-fit rounded-4xl">
        <div class="flex justify-center mt-10 gap-5">
            <button id="coinsBtn" class="text-white rounded-md p-3 bg-purple-500 hover:bg-purple-700 duration-500" style="font-family: 'Sekuya'; font-size: small;">
                Coins
            </button>
            <button id="nftsBtn" class="text-white rounded-md p-3 bg-purple-500 hover:bg-purple-700 duration-500" style="font-family: 'Sekuya'; font-size: small;">
                Nfts
            </button>
        </div>
        <div style="width: 800px;" class="mt-10">
            <canvas id="acquisitions"></canvas>
        </div>
    </div>
</div>

<div class="flex justify-center mt-10 mb-10">
    <div id="tableCoins" class="grid grid-cols-1 gap-2  bg-[#111827] rounded-xl p-10 w-300">

    </div>
</div>


<script type="module" src="/src/main.ts"></script>
</body>

</html>
